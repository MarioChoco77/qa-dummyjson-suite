name: Test Suite (API + E2E)

on:
  push:                      # en cada push a cualquier rama
  pull_request:
  workflow_dispatch:         # ejecución manual desde la pestaña Actions
  schedule:
    - cron: "0 12 * * 1-5"   # corrida diaria L-V (12:00 UTC) para detectar cambios en la API pública

# Cancela corridas obsoletas de la misma rama
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ───────────────────────── 1) API: REST Assured ─────────────────────────
  api-tests:
    name: API tests (REST Assured)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run API tests
        run: mvn -B verify

      - name: Upload Allure results (API)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: api-tests/target/allure-results
          if-no-files-found: warn

      - name: Upload Surefire XML (API)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-api
          path: api-tests/target/surefire-reports
          if-no-files-found: warn

  # ───────────────────────── 2) E2E: Playwright ─────────────────────────
  e2e-tests:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: e2e-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e-tests/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload Allure results (E2E)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-e2e
          path: e2e-tests/allure-results
          if-no-files-found: warn

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e-tests/playwright-report
          if-no-files-found: warn

      - name: Upload traces, screenshots and videos (solo si hay fallos)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: e2e-tests/test-results
          if-no-files-found: ignore

  # ───────────────────────── 3) Reporte unificado Allure ─────────────────────────
  report:
    name: Build Allure report
    needs: [api-tests, e2e-tests]
    if: always()               # se genera incluso cuando hay pruebas fallidas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: allure-results

      - uses: actions/setup-java@v4    # Allure CLI requiere Java
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Allure report
        run: |
          npm install -g allure-commandline
          allure generate allure-results --clean -o allure-report

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report

      # Solo se publica en Pages si ENABLE_PAGES=true (Settings > Variables) y es la rama por defecto
      - name: Upload report for GitHub Pages
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.ENABLE_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

  deploy-pages:
    name: Publish report to GitHub Pages
    needs: report
    if: always() && needs.report.result == 'success' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # ───────────────────────── 4) Notificación ─────────────────────────
  notify:
    name: Notify results
    needs: [api-tests, e2e-tests, report]
    if: always()
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      API_RESULT: ${{ needs.api-tests.result }}
      E2E_RESULT: ${{ needs.e2e-tests.result }}
      BRANCH: ${{ github.ref_name }}
      ACTOR: ${{ github.actor }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      REPO: ${{ github.repository }}
    steps:
      - name: Compute overall status
        run: |
          if [[ "$API_RESULT" == "success" && "$E2E_RESULT" == "success" ]]; then
            echo "STATUS=✅ PASSED" >> "$GITHUB_ENV"
          else
            echo "STATUS=❌ FAILED" >> "$GITHUB_ENV"
          fi

      - name: Write job summary
        run: |
          {
            echo "## Resultado de la suite: $STATUS"
            echo ""
            echo "| Suite | Resultado |"
            echo "|---|---|"
            echo "| API (REST Assured) | $API_RESULT |"
            echo "| E2E (Playwright)   | $E2E_RESULT |"
            echo ""
            echo "Descarga el artefacto **allure-report** o abre el reporte en Pages si está habilitado."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Slack
        if: env.SLACK_WEBHOOK_URL != ''
        run: |
          TEXT="$STATUS — *$REPO* (rama \`$BRANCH\`, por $ACTOR)
          • API: $API_RESULT
          • E2E: $E2E_RESULT
          <$RUN_URL|Ver ejecución y reportes>"
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "$(jq -n --arg text "$TEXT" '{text: $text}')" \
            "$SLACK_WEBHOOK_URL"
